# Local development database. The NetScope server itself runs on the host, not in Docker:
# on macOS/Windows a container cannot see the LAN it would need to scan (docs/ARCHITECTURE.md).
#
#   npm run db:up      start PostgreSQL (waits until it is healthy)
#   npm run db:stop    stop it (data is kept in the postgres-data volume)
#   npm run db:psql    open psql inside the container
#
# Credentials come from the root .env file (template: .env.example), never from this file.

name: netscope

services:
  postgres:
    image: postgres:17
    container_name: netscope-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: netscope
      POSTGRES_DB: netscope
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    ports:
      # Loopback only: the database is never reachable from other machines on the network.
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, when the data volume is first created.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
